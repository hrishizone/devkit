name: Generate npm lockfile

on:
  push:
    branches:
      - production-hardening-pass-1

permissions:
  contents: write

concurrency:
  group: devkit-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Resolve exact dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "Add reproducible npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
